services:

  # ─────────────────────────────────────────────────────
  # MINIO — Object Storage (equivalente AWS S3)
  # ─────────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    env_file:
      - .env
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────
  # MINIO-INIT — Cria buckets e faz upload do CSV raw
  # ─────────────────────────────────────────────────────
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./dados:/dados
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/raw;
      mc mb --ignore-existing local/silver;
      mc mb --ignore-existing local/gold;
      mc mb --ignore-existing local/reports;
      mc cp /dados/bronze/df_fraud_credit.zip local/raw/df_fraud_credit.zip || echo 'ZIP nao encontrado.';
      echo 'MinIO inicializado com sucesso.';
      "
    restart: on-failure

  # ─────────────────────────────────────────────────────
  # POSTGRES — Metadata store interno do Airflow
  # ─────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────
  # AIRFLOW-INIT — Inicializa banco e cria usuário admin
  # Usa imagem custom com Java 17 + PySpark + JARs S3A
  # ─────────────────────────────────────────────────────
  airflow-init:
    build: .
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dados:/opt/airflow/dados
      - ./logs:/opt/airflow/logs
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USERNAME:-admin}
      --password ${AIRFLOW_ADMIN_PASSWORD:-admin123}
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@localiza.com"
    restart: on-failure

  # ─────────────────────────────────────────────────────
  # AIRFLOW-WEBSERVER — Interface web (porta 8080)
  # ─────────────────────────────────────────────────────
  airflow-webserver:
    build: .
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dados:/opt/airflow/dados
      - ./logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────
  # AIRFLOW-SCHEDULER — Executa as DAGs
  # ─────────────────────────────────────────────────────
  airflow-scheduler:
    build: .
    container_name: airflow-scheduler
    command: scheduler
    env_file:
      - .env
    environment:
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dados:/opt/airflow/dados
      - ./logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped


volumes:
  minio_data:
  postgres_data:
